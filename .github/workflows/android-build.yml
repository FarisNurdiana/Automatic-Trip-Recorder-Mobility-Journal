name: Build APK & IPA

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test, build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      # .env is a registered asset; CI builds with the (empty) example values.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Release build: ~4x smaller and faster than debug, signed with the
      # same stable key so it installs as an update over previous builds.
      - name: Build release APK
        run: flutter build apk --release

      # Consumed by the in-app update checker (Pengaturan -> Periksa
      # pembaruan): versionCode is the run number the APK was built with.
      - name: Write version.json
        run: |
          echo "{\"versionCode\": ${{ github.run_number }}, \"apkUrl\": \"https://github.com/${{ github.repository }}/releases/download/debug-latest/app-release.apk\"}" > version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # The release used to carry a debug APK under a different file name;
      # drop it so only the current release APK is downloadable.
      - name: Remove stale debug APK from release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset debug-latest app-debug.apk --yes --repo "$GITHUB_REPOSITORY" || true

      # Publish the APK to a rolling "debug-latest" release so it can be
      # downloaded directly (no zip, no login) from the Releases page. The
      # tag name is kept for URL stability with older instructions.
      - name: Publish APK release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Motivox APK (terbaru)"
          body: |
            APK Motivox terbaru (build release, ${{ github.run_number }}), dibangun otomatis dari commit ${{ github.sha }}.

            Cara pakai (Android):
            1. Unduh `app-release.apk` di bawah.
            2. Instal di HP (atau tarik ke layar emulator Android). Instal langsung di atas versi lama — riwayat tetap aman.

            iOS (`motivox-ios-unsigned.ipa`): IPA tanpa tanda tangan — pasang lewat Sideloadly/AltStore dengan Apple ID Anda sendiri (masa berlaku 7 hari per pemasangan tanpa akun developer berbayar).
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            version.json

  # iOS build without code signing: proves the app compiles for iOS and
  # produces an unsigned IPA that testers can install via sideloading
  # (Sideloadly / AltStore sign it with their own Apple ID). Store/TestFlight
  # distribution additionally needs an Apple Developer account.
  build-ios:
    name: Build iOS (unsigned IPA)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - name: Prepare environment file
        run: cp .env.example .env

      # The project ships a custom Podfile (permission_handler macros);
      # mixing it with Flutter's Swift Package Manager integration makes
      # Xcode fail with "sandbox is not in sync with the Podfile.lock".
      # Force the pure CocoaPods path.
      - name: Use CocoaPods integration
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry motivox-ios-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: motivox-ios-unsigned-ipa
          path: motivox-ios-unsigned.ipa
          retention-days: 14

      # Attach the IPA to the same rolling release next to the APK. The
      # release body/name stay owned by the Android job.
      - name: Publish IPA to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          prerelease: true
          files: motivox-ios-unsigned.ipa
