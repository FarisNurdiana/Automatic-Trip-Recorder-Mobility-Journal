name: Android CI

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test, build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      # .env is a registered asset; CI builds with the (empty) example values.
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      # Publish the debug APK to a rolling "debug-latest" release so it can
      # be downloaded directly (no zip, no login) from the Releases page.
      - name: Publish debug APK release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "TripLog debug APK (terbaru)"
          body: |
            APK debug terbaru, dibangun otomatis dari commit ${{ github.sha }}.

            Cara pakai:
            1. Unduh `app-debug.apk` di bawah.
            2. Tarik file tersebut ke layar emulator Android (atau instal di HP).
          prerelease: true
          files: build/app/outputs/flutter-apk/app-debug.apk
