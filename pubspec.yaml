name: triplog
description: "TripLog — perekam perjalanan otomatis (automatic trip recorder / mobility journal)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0

  # Local database (offline-first)
  drift: ^2.28.0
  # sqlite3 3.x switches to native-assets hooks that download binaries at
  # build time; the 2.x line keeps the classic behavior (bundled binaries via
  # sqlite3_flutter_libs on mobile, system libsqlite3 in tests/desktop),
  # which also works in restricted-network CI environments.
  sqlite3: ^2.9.0
  sqlite3_flutter_libs: ^0.5.34
  path_provider: ^2.1.5
  path: ^1.9.0

  # Supabase (auth + sync)
  supabase_flutter: ^2.9.0

  # Map & geo
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # Platform services
  permission_handler: ^12.0.0
  sensors_plus: ^6.1.1
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.4
  device_info_plus: ^11.4.0
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.3

  # Utilities
  flutter_dotenv: ^5.2.1
  share_plus: ^10.1.0
  intl: ^0.20.2
  uuid: ^4.5.1
  logging: ^1.3.0
  fl_chart: ^0.69.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - .env
    - assets/simulator/
